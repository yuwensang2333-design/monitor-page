<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>告警监测 — 高速公路机电系统运行状态智能监测平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2343d9ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2343d9ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/alarms.css">
</head>
<body>

<div class="backdrop">
  <canvas class="stars" id="stars"></canvas>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
</div>

<div class="viewport">
  <div class="stage" id="stage">

    <!-- 顶部标题 -->
    <header class="hdr">
      <div class="hdr-actions left">
        <a class="btn-back" href="index.html" title="返回总览大屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 6L8.5 12l6 6"/><path d="M8.5 12h9"/>
          </svg>
        </a>
      </div>

      <div class="hdr-wing left"></div>
      <div class="hdr-banner">
        <div class="hdr-plate">
          <h1 class="hdr-title">高速公路机电系统运行状态智能监测系统</h1>
        </div>
      </div>
      <div class="hdr-wing right"></div>

      <div class="hdr-actions right">
        <a class="btn-nav" href="index.html">总览大屏 ›</a>
        <div class="hdr-status">
          <span class="hdr-clock num" id="clock">--:--:--</span>
          <span class="hdr-date" id="date">----</span>
        </div>
      </div>
    </header>

    <!-- 所有告警 -->
    <section class="section-bar">
      <div class="section-ring">
        <svg viewBox="0 0 74 74" fill="none">
          <circle cx="37" cy="37" r="29" stroke="rgba(70,170,255,.25)" stroke-width="3"
                  stroke-dasharray="120 70" transform="rotate(-120 37 37)"/>
          <circle cx="37" cy="37" r="29" stroke="rgba(255,138,60,.9)" stroke-width="3"
                  stroke-dasharray="56 180" transform="rotate(60 37 37)"/>
          <circle cx="37" cy="37" r="21" stroke="rgba(70,170,255,.28)" stroke-width="1"/>
        </svg>
        <span class="ring-core"></span>
      </div>

      <h2 class="section-title">所有告警</h2>
      <div class="section-line"></div>

      <div class="section-stats">
        <div class="st"><span class="st-label">设备总数</span><b class="st-value c-cyan" id="statDevice">1,081</b></div>
        <div class="st"><span class="st-label">告警条目</span><b class="st-value c-red" id="statAlarm">0</b></div>
        <div class="st"><span class="st-label">涉及类别</span><b class="st-value" style="color:#8d6bff" id="statLevel">0</b></div>
        <div class="st"><span class="st-label">告警率</span><b class="st-value c-orange" id="statRate">0%</b></div>
      </div>

      <div class="seg-toggle">
        <button type="button" class="active" data-mode="all">所有告警</button>
        <button type="button" data-mode="current">当前告警</button>
      </div>
    </section>

    <!-- 设备告警卡片 -->
    <section class="device-grid" id="deviceGrid"></section>

    <!-- 底部区域 -->
    <section class="bottom">
      <div class="pane">
        <div class="pane-title">当前确认告警数占比</div>
        <div class="pie-stage">
          <svg id="pieConfirm"></svg>
          <div class="pie-legend2" id="pieLegend2"></div>
        </div>
      </div>

      <div class="pane">
        <div class="pane-title center">
          <i class="tl-line"></i>当前告警列表<i class="tr-line"></i>
        </div>
        <div class="atable">
          <div class="atable-head">
            <span>序号</span>
            <span>告警名称</span>
            <span>告警设备</span>
            <span>告警描述</span>
            <span>告警等级</span>
            <span>告警时长</span>
          </div>
          <div class="atable-body scroll-area" id="alarmTableBody"></div>
        </div>
      </div>
    </section>

  </div>
</div>

<script src="assets/js/util.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/alarms.js"></script>
</body>
</html>
